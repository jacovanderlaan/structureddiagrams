<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <!-- Structured Diagrams: nodes + edges. Its sister site Structured Metadata
       shows the same structure as a schema grid; here it is a graph. The two
       favicons are the thesis in miniature — one source, many views. -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <line x1="11" y1="11" x2="21" y2="11"/>
    <line x1="11" y1="11" x2="11" y2="21"/>
    <line x1="21" y1="11" x2="21" y2="21"/>
    <line x1="11" y1="21" x2="21" y2="21"/>
    <line x1="11" y1="11" x2="21" y2="21"/>
  </g>
  <g fill="#ffffff">
    <rect x="6.4" y="7.6" width="9.2" height="6.8" rx="1.7"/>
    <rect x="18.4" y="8.2" width="7.2" height="5.6" rx="1.7"/>
    <rect x="6.4" y="18.6" width="7.2" height="5.6" rx="1.7"/>
    <rect x="17.2" y="18.0" width="8.4" height="6.4" rx="1.7"/>
  </g>
</svg>
